<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Import_products</title>
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="img/logo.png" alt="Логотип Import Products" width="70">
            <div class="logo__line"></div>
            <h2>import <br> products</h2>
        </div>

        <button class="burger" aria-label="Открыть меню" aria-expanded="false" aria-controls="nav">
            <span class="burger__line"></span>
            <span class="burger__line"></span>
            <span class="burger__line"></span>
        </button>

        <nav class="nav" id="nav">
            <ul>
                <li><a href="#content">О нас</a></li>
                <li><a href="#friends">Каталог</a></li>
                <li><a href="#">Акции и скидки</a></li>
                <li><a href="#">Контакты</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <div class="hero__media">
            </div>
            <div class="hero__overlay">
                <div class="hero__card">
                    <h1 class="hero__title">Все самое вкусное!</h1>
                    <p class="hero__text">
                        В нашем магазине вы можете приобрести не только свежайшие продукты,
                        средства гигиены и бытовую химию, но и приятные подарки для своих близких.
                    </p>
                    <a href="#friends" class="button hero__button">Перейти в каталог</a>
                </div>
                <img class="hero__promo" src="img/plate.png" alt="Праздничный набор продуктов">
            </div>
        </section>
    </main>
</body>
</html>
